[package]
name = "glog-tui"
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
description = "An interactive git log and git show browser"
license = "MIT"
repository = "https://github.com/yairchu/glog"
readme = "README.md"
keywords = ["git", "tui", "git-log", "pager", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["AGENTS.md"]

[[bin]]
name = "glog"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"

# Ratatui's loose transitive bounds otherwise select newer releases whose
# minimum supported Rust versions exceed glog's Rust 1.80 MSRV.
instability = "=0.3.2"
unicode-segmentation = "=1.12.0"
