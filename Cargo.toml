[package]
name = "glog-tui"
version = "0.10.0"
edition = "2021"
description = "An interactive git log and git show browser"
license = "MIT"
repository = "https://github.com/yairchu/glog"
readme = "README.md"
keywords = ["git", "tui", "git-log", "pager", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["AGENTS.md", "docs/"]

[[bin]]
name = "glog"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }

base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
editor-command = "2"
sha2 = "0.10"
mezura-core = "3"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
